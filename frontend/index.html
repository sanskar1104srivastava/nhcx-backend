<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>NHCX Bridge — Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --teal: #0d9488;
    --teal-light: #ccfbf1;
    --teal-dark: #0f766e;
    --ink: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
    --bg: #f8fafc;
    --card: #ffffff;
    --green: #16a34a;
    --green-bg: #dcfce7;
    --red: #dc2626;
    --red-bg: #fee2e2;
    --amber: #d97706;
    --amber-bg: #fef3c7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--ink); }
  .app { display: flex; min-height: 100vh; }
  .sidebar { width: 232px; background: #fff; border-right: 1px solid var(--border); padding: 20px 14px; flex-shrink: 0; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 22px; font-weight: 700; font-size: 18px; }
  .brand .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--teal); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; color: var(--muted); font-size: 14px; cursor: pointer; margin-bottom: 2px; }
  .nav-item:hover { background: #f1f5f9; }
  .nav-item.active { background: var(--teal-light); color: var(--teal-dark); font-weight: 600; }
  .nav-icon { width: 18px; text-align: center; }
  .main { flex: 1; min-width: 0; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 28px; background: #fff; border-bottom: 1px solid var(--border); }
  .search { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; color: var(--muted); font-size: 13px; width: 320px; }
  .content { padding: 26px 28px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
  .stat-card .num { font-size: 26px; font-weight: 700; }
  .stat-card .label { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 18px; }
  .card h2 { font-size: 15px; margin: 0 0 14px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button.btn { background: var(--teal); color: #fff; border: none; border-radius: 8px; padding: 9px 16px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
  button.btn:hover { background: var(--teal-dark); }
  button.btn.secondary { background: #fff; color: var(--ink); border: 1px solid var(--border); }
  button.btn.secondary:hover { background: var(--bg); }
  button.btn:disabled { opacity: .55; cursor: not-allowed; }
  input, select, textarea { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13.5px; font-family: inherit; background: #fff; color: var(--ink); }
  textarea { width: 100%; min-height: 140px; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
  label { font-size: 12.5px; color: var(--muted); display: block; margin-bottom: 4px; }
  .field { margin-bottom: 12px; min-width: 200px; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .pill.green { background: var(--green-bg); color: var(--green); }
  .pill.red { background: var(--red-bg); color: var(--red); }
  .pill.amber { background: var(--amber-bg); color: var(--amber); }
  .pill.grey { background: #f1f5f9; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  code.small { font-size: 11.5px; color: var(--muted); }
  pre.result { background: #0f172a; color: #e2e8f0; padding: 12px 14px; border-radius: 8px; font-size: 12px; overflow: auto; max-height: 260px; margin-top: 12px; }
  .badge-config { font-size: 12px; color: var(--muted); }
  .badge-config input { width: 260px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;

// Module-level so every fetch call can use it without threading it through every
// component's props — this is a single-file admin tool, not worth the prop-drilling.
let currentAdminKey = "";

function apiFetch(url, options = {}) {
  const headers = { ...(options.headers || {}) };
  if (currentAdminKey) headers["X-Admin-Key"] = currentAdminKey;
  return fetch(url, { ...options, headers });
}

function ApiBaseConfig({ apiBase, setApiBase, adminKey, setAdminKey }) {
  return (
    <div className="badge-config row">
      <span>Backend:</span>
      <input value={apiBase} onChange={e => setApiBase(e.target.value)} />
      <span>Admin key:</span>
      <input type="password" value={adminKey} onChange={e => setAdminKey(e.target.value)} placeholder="X-Admin-Key" style={{ width: 140 }} />
    </div>
  );
}

function StatCard({ num, label }) {
  return <div className="stat-card"><div className="num">{num}</div><div className="label">{label}</div></div>;
}

function StatePill({ state }) {
  const map = {
    initiated: "amber", acked: "amber",
    responded_partial: "amber", responded_complete: "green",
    error: "red", delivery_failed: "red", dead: "red",
  };
  return <span className={"pill " + (map[state] || "grey")}>{state}</span>;
}

function Dashboard({ apiBase }) {
  const [logs, setLogs] = useState([]);
  const [error, setError] = useState(null);

  const load = useCallback(() => {
    apiFetch(apiBase + "/logs?limit=100")
      .then(r => r.json())
      .then(setLogs)
      .catch(e => setError(String(e)));
  }, [apiBase]);

  useEffect(load, [load]);

  const counts = logs.reduce((acc, l) => { acc[l.state] = (acc[l.state] || 0) + 1; return acc; }, {});

  return (
    <div>
      <h1>Dashboard</h1>
      <div className="subtitle">NHCX claims-exchange bridge — live view of the request log.</div>
      <div className="grid">
        <StatCard num={logs.length} label="Total logged messages" />
        <StatCard num={counts.responded_complete || 0} label="Completed" />
        <StatCard num={(counts.initiated || 0) + (counts.acked || 0)} label="In flight" />
        <StatCard num={counts.error || 0} label="Errors" />
      </div>
      <div className="card">
        <div className="row" style={{justifyContent: "space-between", marginBottom: 10}}>
          <h2 style={{margin: 0}}>Recent activity</h2>
          <button className="btn secondary" onClick={load}>Refresh</button>
        </div>
        {error && <div className="pill red">{error}</div>}
        <LogTable logs={logs.slice(0, 10)} />
      </div>
    </div>
  );
}

function LogTable({ logs }) {
  if (!logs.length) return <div className="subtitle">No messages logged yet.</div>;
  return (
    <table>
      <thead>
        <tr>
          <th>Direction</th><th>Use case</th><th>State</th><th>Correlation ID</th><th>API call ID</th><th>Created</th>
        </tr>
      </thead>
      <tbody>
        {logs.map(l => (
          <tr key={l.apiCallId}>
            <td>{l.direction}</td>
            <td>{l.useCase}</td>
            <td><StatePill state={l.state} /></td>
            <td><code className="small">{l.correlationId}</code></td>
            <td><code className="small">{l.apiCallId}</code></td>
            <td><code className="small">{(l.createdAt || "").replace("T", " ").slice(0, 19)}</code></td>
          </tr>
        ))}
      </tbody>
    </table>
  );
}

function TestZero({ apiBase }) {
  const [results, setResults] = useState({});
  const [loading, setLoading] = useState({});

  const run = (key, path) => {
    setLoading(l => ({ ...l, [key]: true }));
    apiFetch(apiBase + path)
      .then(async r => ({ ok: r.ok, status: r.status, body: await r.json() }))
      .then(res => setResults(r => ({ ...r, [key]: res })))
      .catch(e => setResults(r => ({ ...r, [key]: { ok: false, body: String(e) } })))
      .finally(() => setLoading(l => ({ ...l, [key]: false })));
  };

  const Row = ({ title, desc, testKey, path }) => (
    <div className="card">
      <div className="row" style={{ justifyContent: "space-between" }}>
        <div>
          <h2 style={{ marginBottom: 4 }}>{title}</h2>
          <div className="subtitle" style={{ marginBottom: 0 }}>{desc}</div>
        </div>
        <button className="btn" disabled={loading[testKey]} onClick={() => run(testKey, path)}>
          {loading[testKey] ? "Running…" : "Run check"}
        </button>
      </div>
      {results[testKey] && (
        <pre className="result">{JSON.stringify(results[testKey].body, null, 2)}</pre>
      )}
    </div>
  );

  return (
    <div>
      <h1>Test 0 — Auth &amp; Cert self-check</h1>
      <div className="subtitle">Run these in order, cheapest failure first (§8 of the integration doc).</div>
      <Row title="1. Get a token" desc="Confirms clientId/clientSecret auth against the ABDM sessions API." testKey="token" path="/test0/token" />
      <Row title="2. fetch/certs — our own participant code" desc="Tells us whether a cert is already registered, or whether we need to generate one." testKey="self" path="/test0/certs/self" />
      <Row title="3. fetch/certs — dummy payer (1000003538@hcx)" desc="Confirms the participant service is reachable and we can encrypt to the sandbox payer." testKey="payer" path="/test0/certs/payer" />
    </div>
  );
}

const DEFAULT_BUNDLE = JSON.stringify({ resourceType: "Bundle", type: "collection", entry: [] }, null, 2);

function SendRequest({ apiBase }) {
  const [form, setForm] = useState({
    hospitalId: "H1",
    useCase: "coverageeligibility",
    endpoint: "/coverageeligibility/check",
    workflowId: "1",
    recipientCode: "1000003538@hcx",
    correlationId: "",
    benAbhaId: "",
    claimNumber: "",
    policyNumber: "",
  });
  const [bundle, setBundle] = useState(DEFAULT_BUNDLE);
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);

  const useCaseEndpoints = {
    insuranceplan: "/insuranceplan/request",
    coverageeligibility: "/coverageeligibility/check",
    preauth: "/preauth/submit",
    predetermination: "/predetermination/submit",
    claim: "/claim/submit",
  };

  const update = (field, value) => {
    const next = { ...form, [field]: value };
    if (field === "useCase") next.endpoint = useCaseEndpoints[value];
    setForm(next);
  };

  const submit = () => {
    setLoading(true);
    setResult(null);
    let fhirBundle;
    try {
      fhirBundle = JSON.parse(bundle);
    } catch (e) {
      setResult({ ok: false, body: "Invalid JSON in FHIR bundle: " + String(e) });
      setLoading(false);
      return;
    }
    const payload = { ...form, fhirBundle };
    if (!payload.correlationId) delete payload.correlationId;
    if (!payload.benAbhaId) delete payload.benAbhaId;
    if (!payload.claimNumber) delete payload.claimNumber;
    if (!payload.policyNumber) delete payload.policyNumber;

    apiFetch(apiBase + "/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    })
      .then(async r => ({ ok: r.ok, status: r.status, body: await r.json() }))
      .then(setResult)
      .catch(e => setResult({ ok: false, body: String(e) }))
      .finally(() => setLoading(false));
  };

  return (
    <div>
      <h1>Send a request</h1>
      <div className="subtitle">Wraps hcxApiService.send() — builds the envelope, encrypts, logs, and posts to NHCX.</div>
      <div className="card">
        <div className="row">
          <div className="field">
            <label>Hospital ID</label>
            <input value={form.hospitalId} onChange={e => update("hospitalId", e.target.value)} />
          </div>
          <div className="field">
            <label>Use case</label>
            <select value={form.useCase} onChange={e => update("useCase", e.target.value)}>
              <option value="insuranceplan">Insurance Plan</option>
              <option value="coverageeligibility">Coverage Eligibility</option>
              <option value="preauth">Preauthorization</option>
              <option value="predetermination">Predetermination</option>
              <option value="claim">Claim</option>
            </select>
          </div>
          <div className="field">
            <label>Endpoint</label>
            <input value={form.endpoint} readOnly />
          </div>
          <div className="field">
            <label>Workflow ID</label>
            <input value={form.workflowId} onChange={e => update("workflowId", e.target.value)} />
          </div>
          <div className="field">
            <label>Recipient code</label>
            <input value={form.recipientCode} onChange={e => update("recipientCode", e.target.value)} />
          </div>
          <div className="field">
            <label>Correlation ID (blank = new claim cycle)</label>
            <input value={form.correlationId} onChange={e => update("correlationId", e.target.value)} />
          </div>
          <div className="field">
            <label>Beneficiary ABHA ID</label>
            <input value={form.benAbhaId} onChange={e => update("benAbhaId", e.target.value)} />
          </div>
          <div className="field">
            <label>Policy number</label>
            <input value={form.policyNumber} onChange={e => update("policyNumber", e.target.value)} />
          </div>
        </div>
        <div className="field" style={{ marginTop: 4 }}>
          <label>FHIR bundle (JSON)</label>
          <textarea value={bundle} onChange={e => setBundle(e.target.value)} />
        </div>
        <button className="btn" disabled={loading} onClick={submit}>{loading ? "Sending…" : "Send"}</button>
        {result && <pre className="result">{JSON.stringify(result.body, null, 2)}</pre>}
      </div>
    </div>
  );
}

function RequestLogPage({ apiBase }) {
  const [logs, setLogs] = useState([]);
  const load = useCallback(() => {
    apiFetch(apiBase + "/logs?limit=200").then(r => r.json()).then(setLogs);
  }, [apiBase]);
  useEffect(load, [load]);

  return (
    <div>
      <h1>Request log</h1>
      <div className="subtitle">nhcx_request_log — every outbound send and inbound callback (§7).</div>
      <div className="card">
        <div className="row" style={{ justifyContent: "flex-end", marginBottom: 10 }}>
          <button className="btn secondary" onClick={load}>Refresh</button>
        </div>
        <LogTable logs={logs} />
      </div>
    </div>
  );
}

function SandboxTools({ apiBase }) {
  const [mobile, setMobile] = useState("9999999999");
  const [policiesResult, setPoliciesResult] = useState(null);
  const [policiesLoading, setPoliciesLoading] = useState(false);

  const lookupPolicies = () => {
    setPoliciesLoading(true);
    apiFetch(apiBase + "/sandbox/policies?identifierType=MobileNo&identifierValue=" + encodeURIComponent(mobile))
      .then(async r => ({ ok: r.ok, body: await r.json() }))
      .then(setPoliciesResult)
      .catch(e => setPoliciesResult({ ok: false, body: String(e) }))
      .finally(() => setPoliciesLoading(false));
  };

  const [correlationId, setCorrelationId] = useState("");
  const [action, setAction] = useState("Approve");
  const [method, setMethod] = useState("Preauth");
  const [processResult, setProcessResult] = useState(null);
  const [processLoading, setProcessLoading] = useState(false);

  const triggerDummyPayer = () => {
    setProcessLoading(true);
    apiFetch(apiBase + "/sandbox/dummy-payer/process", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ correlationId, action, method }),
    })
      .then(async r => ({ ok: r.ok, body: await r.json() }))
      .then(setProcessResult)
      .catch(e => setProcessResult({ ok: false, body: String(e) }))
      .finally(() => setProcessLoading(false));
  };

  const [paymentResult, setPaymentResult] = useState(null);
  const [paymentLoading, setPaymentLoading] = useState(false);

  const triggerPaymentNotice = () => {
    setPaymentLoading(true);
    apiFetch(apiBase + "/sandbox/dummy-payer/payment-notice", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ correlationId }),
    })
      .then(async r => ({ ok: r.ok, body: await r.json() }))
      .then(setPaymentResult)
      .catch(e => setPaymentResult({ ok: false, body: String(e) }))
      .finally(() => setPaymentLoading(false));
  };

  return (
    <div>
      <h1>Sandbox tools</h1>
      <div className="subtitle">Participant Service (§6) and the dummy-payer side channel that drives test flows 3–7 (§9).</div>

      <div className="card">
        <h2>Get policies (Participant Service — plain JSON, no JWE)</h2>
        <div className="subtitle" style={{ marginBottom: 12 }}>
          Resolves payerid + processingid for a patient identifier. Use processingid as x-hcx-recipient_code
          when the payer sits under a TPA.
        </div>
        <div className="row">
          <div className="field">
            <label>Mobile number</label>
            <input value={mobile} onChange={e => setMobile(e.target.value)} />
          </div>
        </div>
        <button className="btn" disabled={policiesLoading} onClick={lookupPolicies}>
          {policiesLoading ? "Looking up…" : "Get policies"}
        </button>
        {policiesResult && <pre className="result">{JSON.stringify(policiesResult.body, null, 2)}</pre>}
      </div>

      <div className="card">
        <h2>Dummy payer — process/request</h2>
        <div className="subtitle" style={{ marginBottom: 12 }}>
          Sandbox-only: the dummy payer won't act on a submitted preauth/claim by itself — this tells it
          what decision to make so it fires the matching on_submit callback. Field names are a best-effort
          reading of the doc; confirm against the real Postman collection if this 500s unexpectedly.
        </div>
        <div className="row">
          <div className="field">
            <label>Correlation ID (from a prior /send)</label>
            <input value={correlationId} onChange={e => setCorrelationId(e.target.value)} style={{ width: 320 }} />
          </div>
          <div className="field">
            <label>Action</label>
            <select value={action} onChange={e => setAction(e.target.value)}>
              <option value="Approve">Approve</option>
              <option value="Reject">Reject</option>
              <option value="Query">Query</option>
            </select>
          </div>
          <div className="field">
            <label>Method</label>
            <select value={method} onChange={e => setMethod(e.target.value)}>
              <option value="Preauth">Preauth</option>
              <option value="Claim">Claim</option>
            </select>
          </div>
        </div>
        <div className="row">
          <button className="btn" disabled={processLoading || !correlationId} onClick={triggerDummyPayer}>
            {processLoading ? "Sending…" : "Trigger decision"}
          </button>
          <button className="btn secondary" disabled={paymentLoading || !correlationId} onClick={triggerPaymentNotice}>
            {paymentLoading ? "Sending…" : "Trigger paymentNotice/init"}
          </button>
        </div>
        {processResult && <pre className="result">{JSON.stringify(processResult.body, null, 2)}</pre>}
        {paymentResult && <pre className="result">{JSON.stringify(paymentResult.body, null, 2)}</pre>}
      </div>
    </div>
  );
}

const NAV = [
  { key: "dashboard", label: "Dashboard", icon: "▦" },
  { key: "test0", label: "Auth & Certs", icon: "⚿" },
  { key: "send", label: "Send Request", icon: "↗" },
  { key: "sandbox", label: "Sandbox Tools", icon: "⚙" },
  { key: "logs", label: "Request Log", icon: "≡" },
];

function App() {
  const [page, setPage] = useState("dashboard");
  const [apiBase, setApiBase] = useState("https://bpki9do1wj.execute-api.ap-south-1.amazonaws.com");
  const [adminKey, setAdminKey] = useState("");
  currentAdminKey = adminKey;

  return (
    <div className="app">
      <div className="sidebar">
        <div className="brand"><div className="logo">N</div>NHCX Bridge</div>
        {NAV.map(n => (
          <div key={n.key} className={"nav-item" + (page === n.key ? " active" : "")} onClick={() => setPage(n.key)}>
            <span className="nav-icon">{n.icon}</span>{n.label}
          </div>
        ))}
      </div>
      <div className="main">
        <div className="topbar">
          <input className="search" placeholder="Search correlation ID, api call ID…" disabled />
          <ApiBaseConfig apiBase={apiBase} setApiBase={setApiBase} adminKey={adminKey} setAdminKey={setAdminKey} />
        </div>
        <div className="content">
          {page === "dashboard" && <Dashboard apiBase={apiBase} />}
          {page === "test0" && <TestZero apiBase={apiBase} />}
          {page === "send" && <SendRequest apiBase={apiBase} />}
          {page === "sandbox" && <SandboxTools apiBase={apiBase} />}
          {page === "logs" && <RequestLogPage apiBase={apiBase} />}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
